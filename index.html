<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Proveedores | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body onload="cargarDashboard()">

  <!-- Sidebar & Layout Wrapper -->
  <div class="d-flex">
    
    <!-- Sidebar -->
    <aside class="bg-white border-end vh-100 position-fixed" style="width: 250px; z-index: 1000;">
      <div class="p-4 border-bottom d-flex align-items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"></path><path d="M14 8h-2.5a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-2.5m2 0v1.5m0 -9v1.5"></path></svg>
        <span class="fw-bold text-primary">SaaS Proveedores</span>
      </div>
      <nav class="p-3">
        <a href="index.html" class="nav-link active d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v8h-6z"></path><path d="M4 16h6v4h-6z"></path><path d="M14 12h6v8h-6z"></path><path d="M14 4h6v4h-6z"></path></svg>
          Dashboard
        </a>
        <a href="proveedores.html" class="nav-link d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"></path></svg>
          Proveedores
        </a>
        <a href="procesos.html" class="nav-link d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path><path d="M9 17h6"></path><path d="M9 13h6"></path></svg>
          Procesos
        </a>
        <a href="pagos.html" class="nav-link d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"></path><path d="M3 10l18 0"></path><path d="M7 15l.01 0"></path><path d="M11 15l2 0"></path></svg>
          Pagos
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow-1" style="margin-left: 250px;">
      <!-- Topbar -->
      <header class="navbar-custom d-flex justify-content-end align-items-center px-4" style="height: 64px;">
        <span class="text-secondary fw-medium me-3">Administrador</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary cursor-pointer"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path></svg>
      </header>

      <!-- Page Content -->
      <div class="p-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="m-0 fw-bold">Dashboard Financiero 360°</h2>
          <button class="btn btn-primary" onclick="cargarDashboard()">Actualizar</button>
        </div>

        <!-- KPIs Superiores -->
        <div class="row mb-4 g-3">
          <div class="col-md-3">
            <div class="card h-100 mb-0">
              <div class="card-body d-flex align-items-center">
                <div class="kpi-icon bg-primary text-white">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.7 8a3 3 0 0 0 -2.7 -2h-4a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-4a3 3 0 0 1 -2.7 -2"></path><path d="M12 3v3m0 12v3"></path></svg>
                </div>
                <div>
                  <div class="kpi-value" id="kpiTotalCompras">...</div>
                  <div class="kpi-label">Valor Total de Compras</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card h-100 mb-0">
              <div class="card-body d-flex align-items-center">
                <div class="kpi-icon bg-success text-white">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"></path><path d="M3 10l18 0"></path><path d="M7 15l.01 0"></path><path d="M11 15l2 0"></path></svg>
                </div>
                <div>
                  <div class="kpi-value" id="kpiTotalPagado">...</div>
                  <div class="kpi-label">Total Pagado</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card h-100 mb-0">
              <div class="card-body d-flex align-items-center">
                <div class="kpi-icon bg-danger text-white">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
                </div>
                <div>
                  <div class="kpi-value text-danger" id="kpiSaldoPendiente">...</div>
                  <div class="kpi-label">Saldo Pendiente Global</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card h-100 mb-0">
              <div class="card-body d-flex align-items-center">
                <div class="kpi-icon bg-warning text-white">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l6 -6"></path><circle cx="9.5" cy="8.5" r=".5" fill="currentColor"></circle><circle cx="14.5" cy="13.5" r=".5" fill="currentColor"></circle><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"></path></svg>
                </div>
                <div>
                  <div class="kpi-value" id="kpiComplementos">...</div>
                  <div class="kpi-label">Complementos Faltantes</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabla de Procesos Activos -->
        <div class="card mb-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0 fw-bold">Procesos Activos</h5>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>ID / Concepto</th>
                    <th>Proveedor</th>
                    <th>Monto Acordado</th>
                    <th>Saldo Pendiente</th>
                    <th>Estatus</th>
                  </tr>
                </thead>
                <tbody id="tablaProcesosDashboard">
                  <tr><td colspan="5" class="text-center">Cargando procesos...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
