<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Seguro de Proveedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"></path><path d="M12 11a1 1 0 1 0 0 2a1 1 0 0 0 0 -2"></path><path d="M12 12v2.5"></path></svg>
        Portal Seguro de Proveedores
      </a>
    </div>
  </nav>

  <div class="container my-5 d-flex justify-content-center">
    <div class="card w-100" style="max-width: 600px;">
      <div class="card-body p-5" id="portal-content">
        
        <div class="text-center mb-4">
          <h3 class="fw-bold">Carga de CFDI Complementario</h3>
          <p class="text-secondary">Referencia de Pago: <strong id="ref-pago">PAG-88219</strong></p>
        </div>
        
        <div class="alert alert-warning mb-4">
          <small>Por favor, suba el archivo XML y PDF correspondientes al complemento de pago.</small>
        </div>

        <form id="form-cfdi" onsubmit="subirCFDI(event)">
          <div class="mb-4">
            <label class="form-label fw-medium">Archivo XML del CFDI *</label>
            <input type="file" name="xmlFile" class="form-control" accept=".xml" required />
          </div>

          <div class="mb-4">
            <label class="form-label fw-medium">Archivo PDF del CFDI (Opcional)</label>
            <input type="file" name="pdfFile" class="form-control" accept=".pdf" />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Subir CFDI</button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // Extraer parámetro de la URL (Ej: portal.html?ref=PAG-123)
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('ref')) {
      document.getElementById('ref-pago').innerText = urlParams.get('ref');
    }
  </script>
</body>
</html>
