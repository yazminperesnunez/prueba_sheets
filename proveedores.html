<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Proveedor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="d-flex">
    <!-- Sidebar -->
    <aside class="bg-white border-end vh-100 position-fixed" style="width: 250px; z-index: 1000;">
      <div class="p-4 border-bottom d-flex align-items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"></path><path d="M14 8h-2.5a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-2.5m2 0v1.5m0 -9v1.5"></path></svg>
        <span class="fw-bold text-primary">SaaS Proveedores</span>
      </div>
      <nav class="p-3">
        <a href="index.html" class="nav-link d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v8h-6z"></path><path d="M4 16h6v4h-6z"></path><path d="M14 12h6v8h-6z"></path><path d="M14 4h6v4h-6z"></path></svg>
          Dashboard
        </a>
        <a href="proveedores.html" class="nav-link active d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"></path></svg>
          Proveedores
        </a>
        <a href="procesos.html" class="nav-link d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path><path d="M9 17h6"></path><path d="M9 13h6"></path></svg>
          Procesos
        </a>
        <a href="pagos.html" class="nav-link d-flex align-items-center gap-2 p-2 rounded mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"></path><path d="M3 10l18 0"></path><path d="M7 15l.01 0"></path><path d="M11 15l2 0"></path></svg>
          Pagos
        </a>
      </nav>
    </aside>

    <main class="flex-grow-1" style="margin-left: 250px;">
      <header class="navbar-custom d-flex justify-content-end align-items-center px-4" style="height: 64px;">
        <span class="text-secondary fw-medium">Administrador</span>
      </header>

      <div class="p-4 mx-auto" style="max-width: 1000px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-3">
            <div class="bg-primary text-white p-2 rounded">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l18 0"></path><path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4"></path><path d="M5 21l0 -10.15"></path><path d="M19 21l0 -10.15"></path><path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4"></path></svg>
            </div>
            <h2 class="m-0 fw-bold">Proveedores</h2>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAltaProveedor">
            + Nuevo Proveedor
          </button>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>RFC</th>
                    <th>Razón Social</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Documentos</th>
                  </tr>
                </thead>
                <tbody id="tablaProveedores">
                  <!-- Los proveedores se cargarán aquí dinámicamente -->
                  <tr><td colspan="5" class="text-center">Cargando proveedores...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Alta Proveedor -->
      <div class="modal fade" id="modalAltaProveedor" tabindex="-1" aria-labelledby="modalAltaProveedorLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="modalAltaProveedorLabel">Alta de Proveedor</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="formAltaProveedor" onsubmit="registrarProveedor(event)">
                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label class="form-label fw-medium">RFC *</label>
                    <input type="text" name="rfc" class="form-control" required placeholder="Ej. ABC123456T1" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-medium">Razón Social *</label>
                    <input type="text" name="razonSocial" class="form-control" required placeholder="Nombre de la Empresa S.A. de C.V." />
                  </div>
                  
                  <div class="col-md-12">
                    <label class="form-label fw-medium">Régimen Fiscal *</label>
                    <select name="regimenFiscal" class="form-select" required>
                      <option value="">Selecciona un régimen...</option>
                      <option value="601">601 - General de Ley Personas Morales</option>
                      <option value="603">603 - Personas Morales con Fines no Lucrativos</option>
                      <option value="612">612 - Personas Físicas con Actividades Empresariales</option>
                      <option value="626">626 - Régimen Simplificado de Confianza (RESICO)</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-medium">Correo Electrónico *</label>
                    <input type="email" name="correo" class="form-control" required placeholder="contacto@empresa.com" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-medium">Teléfono</label>
                    <input type="tel" name="telefono" class="form-control" placeholder="55 1234 5678" />
                  </div>

                  <div class="col-md-12">
                    <label class="form-label fw-medium">Dirección Fiscal</label>
                    <textarea name="direccion" class="form-control" rows="2" placeholder="Calle, Número, Colonia, C.P., Ciudad"></textarea>
                  </div>
                </div>

                <h5 class="mb-3 fw-bold border-bottom pb-2">Documentación Adjunta</h5>
                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label class="form-label fw-medium">Constancia de Situación Fiscal (PDF) *</label>
                    <input type="file" name="csf" class="form-control" accept=".pdf" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-medium">Comprobante de Domicilio</label>
                    <input type="file" name="comprobante" class="form-control" accept=".pdf,.png,.jpg" />
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
